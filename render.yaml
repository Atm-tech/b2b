services:
  - type: web
    name: b2b
    runtime: node
    plan: starter
    region: ohio
    autoDeployTrigger: checksPass
    buildCommand: npm ci --prefer-offline --no-audit && npm run build -w packages/domain && npm run build -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/api/**
        - packages/domain/**
        - postgres/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: aapoorti-db
          property: connectionString
      - key: UPLOADS_DIR
        value: /tmp/aapoorti-uploads
      - key: ALLOWED_ORIGINS
        sync: false
      - key: REQUEST_BODY_LIMIT
        value: 2mb
      - key: MAX_UPLOAD_BYTES
        value: "8388608"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: aapoorti-proofs
      - key: R2_OBJECT_PREFIX
        value: proofs
databases:
  - name: aapoorti-db
    plan: basic-256mb
    region: ohio
    databaseName: aapoorti_b2b
    user: aapoorti_app
