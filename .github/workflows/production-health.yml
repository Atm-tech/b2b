name: Production Health

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: production-health
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Render API
        run: |
          curl --fail-with-body --location \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 30 \
            https://b2b-v8kb.onrender.com/health

      - name: Check Vercel frontend
        run: |
          curl --fail-with-body --location \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 30 \
            --output /dev/null \
            https://b2b-api-theta.vercel.app
